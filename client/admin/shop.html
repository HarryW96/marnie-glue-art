<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prints &amp; Odd Bits — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="../index.html" class="nav-logo">Studio</a>
    <div class="nav-links"><a href="../index.html">View Site</a></div>
    <button onclick="Auth.logout()" style="background:none;border:none;font-family:var(--font-body);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;">Log out</button>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="admin-sidebar-title">Manage</p>
      <a href="index.html" class="admin-nav-link">All Works</a>
      <a href="upload.html" class="admin-nav-link">Add New Work</a>
      <a href="categories.html" class="admin-nav-link">Categories</a>
      <a href="shop.html" class="admin-nav-link active">Prints &amp; Odd Bits</a>
      <a href="enquiries.html" class="admin-nav-link">Enquiries</a>
      <a href="settings.html" class="admin-nav-link">Settings</a>
    </aside>

    <main class="admin-main">
      <h1 class="admin-heading">Prints &amp; Odd Bits</h1>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <p id="item-count" style="font-size:0.85rem;color:var(--muted)">Loading…</p>
        <a href="shop-upload.html" style="font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--rust);text-decoration:none;border-bottom:1px solid var(--rust-light);padding-bottom:2px;">+ Add new item</a>
      </div>
      <div class="admin-works-grid" id="shop-grid"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script>
    async function init() {
      const ok = await Auth.check();
      if (!ok) { location.href = 'login.html'; return; }
      loadItems();
    }

    async function loadItems() {
      try {
        const items = await Shop.list();
        const grid = document.getElementById('shop-grid');
        document.getElementById('item-count').textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;

        if (items.length === 0) {
          grid.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;">No items yet. <a href="shop-upload.html" style="color:var(--rust)">Add your first item →</a></p>';
          return;
        }

        grid.innerHTML = '';
        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'admin-work-card';
          const thumb = item.images?.[0]?.image_url
            ? `<img src="${item.images[0].image_url.replace('/upload/', '/upload/w_400,q_auto,f_auto/')}" alt="${item.title}" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;" />`
            : `<div style="width:100%;aspect-ratio:1;background:var(--blush);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;color:var(--muted);">No image</div>`;
          card.innerHTML = `
            ${thumb}
            <div class="admin-card-body">
              <div class="admin-card-title">${item.title}</div>
              <div class="admin-card-meta">${item.price}${item.edition ? ' · ' + item.edition : ''} · ${item.available ? '<span style="color:var(--rust)">Available</span>' : 'Sold'}</div>
              <div class="admin-card-actions">
                <a href="shop-edit.html?id=${item.id}" class="admin-btn">Edit</a>
                <a href="../shop.html" class="admin-btn" target="_blank">View</a>
                <button class="admin-btn" onclick="toggleAvailable('${item.id}', ${item.available})" style="color:${item.available ? 'var(--rust)' : 'var(--muted)'}">${item.available ? '● Available' : '○ Sold'}</button>
                <button class="admin-btn danger" onclick="deleteItem('${item.id}', '${item.title.replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </div>`;
          grid.appendChild(card);
        });
      } catch {
        document.getElementById('shop-grid').innerHTML =
          '<p style="color:var(--rust);font-size:0.9rem;">Failed to load items. Is the server running?</p>';
      }
    }

    async function toggleAvailable(id, current) {
      try {
        await Shop.update(id, { available: !current });
        showToast(current ? 'Marked as sold.' : 'Marked as available.');
        loadItems();
      } catch {
        showToast('Failed to update status.');
      }
    }

    async function deleteItem(id, title) {
      if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
      try {
        await Shop.delete(id);
        showToast('Item deleted.');
        loadItems();
      } catch {
        showToast('Failed to delete item.');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    init();
  </script>
</body>
</html>
